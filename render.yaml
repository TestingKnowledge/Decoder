services:
  - type: web
    name: discord-deobfuscate-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false   # set in the Render dashboard, never in the repo
      - key: PYTHON_VERSION
        value: "3.11.11"   # REQUIRED: discord.py 2.3.2 imports audioop,
                           # which was removed from the stdlib in Python 3.13+
    healthCheckPath: /healthz
